name: Deploy explain Worker

on:
  push:
    branches: [main, claude/youthful-edison-36ka3a]
    paths:
      - 'worker/**'
      - 'scripts/**'
      - 'data/**'
      - 'src/carer/needs.ts'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data
      - name: Ensure D1 database and apply migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="mindtouch-share") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create mindtouch-share
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="mindtouch-share") | .uuid')
          fi
          echo "D1 database id: $id"
          sed -i "s/REPLACE_AT_DEPLOY/$id/" wrangler.toml
          npx wrangler d1 migrations apply mindtouch-share --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            OPENROUTER_API_KEY
            SHARE_ADMIN_TOKEN
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SHARE_ADMIN_TOKEN: ${{ secrets.SHARE_ADMIN_TOKEN }}
