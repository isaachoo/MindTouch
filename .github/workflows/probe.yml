name: Probe people API (temporary)

on:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Browser test
        run: |
          cat > t.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 390, height: 900 } });
            p.on('console', m => console.log('console', m.type(), m.text()));
            p.on('requestfailed', r => console.log('requestfailed', r.method(), r.url(), r.failure()?.errorText));
            p.on('response', r => { if (r.url().includes('mt-api')) console.log('response', r.status(), r.request().method(), r.url(), JSON.stringify(r.headers())); });
            await p.goto('https://mt.ohcasi.com/#/people');
            await p.waitForSelector('#people-input');
            await p.fill('#people-input', '很怕人前講野');
            await p.click('.people-go');
            await p.waitForSelector('.people-result, .people-error', { timeout: 90000 });
            console.log('RESULT', await p.textContent('.people-result, .people-error'));
            await b.close();
          })();
          JS
          node t.cjs
