name: Probe people API (temporary)

on:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 60
      - name: Match and poll
        run: |
          for t in '失戀好傷心' '照顧媽媽好攰'; do
            echo "=== $t"
            start=$(date +%s)
            key=$(curl -sS -m 20 -X POST https://mt-api.ohcasi.com/people/match -H 'Content-Type: application/json' -d "{\"text\":\"$t\"}" | tee /dev/stderr | jq -r '.key // empty')
            for i in $(seq 1 40); do
              sleep 1.5
              out=$(curl -sS -m 20 "https://mt-api.ohcasi.com/people/result?key=$key")
              if ! echo "$out" | jq -e '.pending' >/dev/null 2>&1; then echo "$out" | head -c 900; echo; break; fi
            done
            echo "elapsed=$(( $(date +%s) - start ))s"
          done
