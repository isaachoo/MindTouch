name: Probe people API (temporary)

on:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight
        run: |
          curl -sS -i -m 30 -X OPTIONS https://mt-api.ohcasi.com/people/match \
            -H 'Origin: https://mt.ohcasi.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' || true
      - name: Match
        run: |
          curl -sS -i -m 90 -w '\ntime_total=%{time_total}\n' -X POST https://mt-api.ohcasi.com/people/match \
            -H 'Origin: https://mt.ohcasi.com' -H 'Content-Type: application/json' \
            -d '{"text":"很怕人前講野"}' || true
      - name: Explain (control)
        run: |
          curl -sS -i -m 60 -X POST https://mt-api.ohcasi.com/explain \
            -H 'Origin: https://mt.ohcasi.com' -H 'Content-Type: application/json' \
            -d '{"quoteId":"x","categoryId":"C01"}' | head -20 || true
