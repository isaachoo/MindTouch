name = "mindtouch-explain"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Custom domain for the API. Add it once in the Cloudflare dashboard
# (Worker → Settings → Domains & Routes → Add → Custom domain), or uncomment:
# routes = [{ pattern = "mt-api.ohcasi.com", custom_domain = true }]

[vars]
MODEL = "deepseek/deepseek-v4-flash-0731"
ALLOWED_ORIGINS = "https://mt.ohcasi.com,http://localhost:5173,http://localhost:4173"
# Secret (set via GitHub Actions or `wrangler secret put`): OPENROUTER_API_KEY

# 你也分享 posts. The deploy workflow creates the database once and fills in database_id.
[[d1_databases]]
binding = "SHARE_DB"
database_name = "mindtouch-share"
database_id = "REPLACE_AT_DEPLOY"
migrations_dir = "migrations"
